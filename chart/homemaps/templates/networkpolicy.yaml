{{- if .Values.networkPolicy.enabled }}
{{- $l := dict "root" . "name" "network" }}
# Incoming traffic: closed by default. The components talk to each other, the
# gateway may only reach the web pod (which proxies the rest), Prometheus the
# metrics. Outgoing stays open: the build jobs and the importer fetch their data outside.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "homemaps.fullname" . }}-internal
  labels: {{- include "homemaps.labels" $l | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "homemaps.fullname" . }}-web
  labels: {{- include "homemaps.labels" $l | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "homemaps.selector" (dict "root" . "name" "web") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - { port: 8080 }
      from:
        {{- range .Values.networkPolicy.ingressNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
{{- if .Values.website.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "homemaps.fullname" . }}-website
  labels: {{- include "homemaps.labels" $l | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "homemaps.selector" (dict "root" . "name" "website") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - { port: 8080 }
      from:
        {{- range .Values.networkPolicy.ingressNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
{{- end }}
{{- if and .Values.valhalla.enabled .Values.valhalla.traffic.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "homemaps.fullname" . }}-metrics
  labels: {{- include "homemaps.labels" $l | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "homemaps.selector" (dict "root" . "name" "valhalla") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - { port: 9100 }
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}
{{- end }}
{{- end }}
