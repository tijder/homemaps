{{- if .Values.web.enabled }}
# `helm test`: alles loopt via de web-pod, dus één pod die de vier paden opvraagt
# bewijst dat de proxy en de backends elkaar vinden.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "homemaps.fullname" . }}-test
  labels: {{- include "homemaps.labels" (dict "root" . "naam" "test") | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: test
      image: docker.io/curlimages/curl:8.22.0
      securityContext: {{- include "homemaps.containerSecurity" . | nindent 8 }}
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          W=http://{{ include "homemaps.onderdeel" (dict "root" . "naam" "web") }}:8080
          curl -fsS $W/healthz
          curl -fsS -o /dev/null $W/
          {{- if .Values.valhalla.enabled }}
          curl -fsS $W/valhalla/status | grep -q version
          {{- end }}
          {{- if .Values.tiles.enabled }}
          curl -fsS $W/tiles/data/v3.json | grep -q tiles
          {{- end }}
          {{- if .Values.photon.enabled }}
          curl -fsS "$W/geocode?q=a&limit=1" | grep -q features
          {{- end }}
          echo alles bereikbaar
{{- end }}
