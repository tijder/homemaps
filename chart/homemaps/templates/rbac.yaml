{{- if or .Values.tiles.enabled .Values.valhalla.enabled }}
{{- $l := dict "root" . "name" "refresher" }}
# Just enough for the build jobs to delete the pod that reads their files.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "homemaps.fullname" . }}-refresher
  labels: {{- include "homemaps.labels" $l | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "homemaps.fullname" . }}-refresher
  labels: {{- include "homemaps.labels" $l | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    # `watch` is needed: `kubectl delete pod` watches until the pod is really gone.
    verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "homemaps.fullname" . }}-refresher
  labels: {{- include "homemaps.labels" $l | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "homemaps.fullname" . }}-refresher
subjects:
  - kind: ServiceAccount
    name: {{ include "homemaps.fullname" . }}-refresher
    namespace: {{ .Release.Namespace }}
{{- end }}
