{{- if and .Values.ingress.enabled .Values.web.enabled }}
{{- $w := dict "root" . "naam" "web" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "homemaps.fullname" . }}
  labels: {{- include "homemaps.labels" $w | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "homemaps.onderdeel" $w }}
                port: { number: 8080 }
    {{- end }}
{{- end }}
