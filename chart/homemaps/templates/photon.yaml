{{- if .Values.photon.enabled }}
{{- $p := dict "root" . "name" "photon" }}
{{- $name := include "homemaps.component" $p }}
{{ include "homemaps.pvc" (merge (dict "size" .Values.photon.size) $p) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "homemaps.labels" $p | nindent 4 }}
spec:
  {{- with .Values.photon.ipFamilies }}
  ipFamilies: {{- toYaml . | nindent 4 }}
  ipFamilyPolicy: SingleStack
  {{- end }}
  selector: {{- include "homemaps.selector" $p | nindent 4 }}
  ports:
    - { name: http, port: 2322, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "homemaps.labels" $p | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 0
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "homemaps.selector" $p | nindent 6 }}
  template:
    metadata:
      labels: {{- include "homemaps.labels" $p | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- include "homemaps.podSecurity" (dict "root" . "uid" .Values.photon.runAsUser) | nindent 8 }}
      containers:
        # The image fetches the index on first start and keeps it up to date
        # itself; so there is no build job.
        - name: photon
          image: {{ include "homemaps.image" (dict "root" . "image" .Values.photon.image) }}
          imagePullPolicy: {{ .Values.photon.image.pullPolicy }}
          env:
            - { name: IMPORT_MODE, value: "db" }
            - { name: LOG_LEVEL, value: "INFO" }
            - { name: FILE_URL, value: {{ .Values.photon.dbUrl | quote }} }
            - { name: MD5_URL, value: {{ printf "%s.md5" .Values.photon.dbUrl | quote }} }
            # Explicit, and not left to the JVM: it derives its heap from the memory
            # it sees, and that is not the pod's limit everywhere. In kind on a
            # GitHub runner it took 3.9 GB with a limit of 1 GiB, and OpenSearch
            # then refuses to start ("total physical memory minus JVM heap is
            # non-positive").
            - { name: JAVA_PARAMS, value: {{ printf "-Xms%s -Xmx%s" .Values.photon.heap .Values.photon.heap | quote }} }
          securityContext: {{- include "homemaps.containerSecurity" . | nindent 12 }}
          ports:
            - { name: http, containerPort: 2322 }
          # The first start downloads and unpacks the index; that takes a long time.
          startupProbe:
            httpGet: { path: /status, port: http }
            periodSeconds: 30
            failureThreshold: 120
          readinessProbe:
            httpGet: { path: /status, port: http }
            periodSeconds: 30
          resources: {{- toYaml .Values.photon.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /photon/data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: {{ $name }} }
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
{{- end }}
