{{- if .Values.tiles.enabled }}
{{- $t := dict "root" . "naam" "tiles" }}
{{- $naam := include "homemaps.onderdeel" $t }}
{{- $scratch := dict "root" . "naam" "planetiler-scratch" }}
{{- $pt := .Values.tiles.planetiler }}
{{ include "homemaps.pvc" (merge (dict "size" .Values.tiles.size) $t) }}
---
{{ include "homemaps.pvc" (merge (dict "size" $pt.scratchSize) $scratch) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $naam }}
  labels: {{- include "homemaps.labels" $t | nindent 4 }}
data:
  bootstrap.sh: | {{- .Files.Get "files/bootstrap.sh" | nindent 4 }}
  samenvoegen.py: | {{- .Files.Get "files/samenvoegen.py" | nindent 4 }}
  # De sleutel `v3` onder `data` is niet vrij te kiezen: de style-local.json van
  # OpenMapTiles verwijst naar `mbtiles://{v3}`.
  config.json: |
    {
      "options": {
        "paths": { "root": "/data", "fonts": "fonts", "styles": "styles", "mbtiles": "tiles" },
        "formatQuality": { "jpeg": 80, "webp": 90 },
        "maxScaleFactor": 2,
        "minRendererPoolSizes": {{ .Values.tiles.rendererPool.min | toJson }},
        "maxRendererPoolSizes": {{ .Values.tiles.rendererPool.max | toJson }},
        "serveAllFonts": true,
        "serveStaticMaps": false,
        "allowRemoteMarkerIcons": false,
        "staticAttributionText": "© OpenMapTiles © OpenStreetMap contributors"
      },
      "styles": {
        {{- range $i, $stijl := .Values.tiles.styles }}
        {{- if $i }},{{ end }}
        {{ $stijl | quote }}: { "style": "{{ $stijl }}/style-local.json", "serve_rendered": true, "serve_data": true }
        {{- end }}
      },
      "data": { "v3": { "mbtiles": "kaart.mbtiles" } }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $naam }}
  labels: {{- include "homemaps.labels" $t | nindent 4 }}
spec:
  selector: {{- include "homemaps.selector" $t | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $naam }}
  labels: {{- include "homemaps.labels" $t | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 0
  # Het volume is ReadWriteOnce: de oude pod moet weg voordat de nieuwe kan starten.
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "homemaps.selector" $t | nindent 6 }}
  template:
    metadata:
      labels: {{- include "homemaps.labels" $t | nindent 8 }}
      annotations:
        checksum/config: {{ .Files.Get "files/bootstrap.sh" | sha256sum | trunc 16 }}-{{ toJson .Values.tiles.styles | sha256sum | trunc 16 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- include "homemaps.podSecurity" (dict "root" .) | nindent 8 }}
      initContainers:
        # Zet eenmalig de stijlen en fonts op het volume (het image bundelt alleen
        # `basic-preview`) en wacht daarna tot er een mbtiles is.
        - name: bootstrap
          image: docker.io/library/alpine:3.24
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/script/bootstrap.sh"]
          env:
            - { name: PLANETILER_CRONJOB, value: {{ printf "%s-planetiler" $naam | quote }} }
          securityContext: {{- include "homemaps.containerSecurity" . | nindent 12 }}
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: script, mountPath: /script }
            - { name: tmp, mountPath: /tmp }
      containers:
        # Geen `command:`: de entrypoint van het image start zelf Xvfb, dat de
        # server-side renderer nodig heeft.
        - name: tileserver
          image: {{ include "homemaps.image" (dict "root" . "image" .Values.tiles.image) }}
          imagePullPolicy: {{ .Values.tiles.image.pullPolicy }}
          args:
            - "--config"
            - "/script/config.json"
            - "--port"
            - "8080"
            {{- with .Values.tiles.publicUrl }}
            - "--public_url"
            - {{ . | quote }}
            {{- end }}
          env:
            # Zonder vaste publicUrl bouwt tileserver-gl zijn URL's uit de Host-header
            # (de nginx van de web-pod zet X-Forwarded-Path erbij). Dan mogen alleen de
            # eigen hostnamen: anders kan een verzonnen Host in een gecachet antwoord
            # belanden.
            - { name: TILESERVER_GL_ALLOWED_HOSTS, value: {{ include "homemaps.allowedHosts" . | quote }} }
            - { name: HOME, value: "/tmp" }
            - { name: XDG_CACHE_HOME, value: "/tmp" }
          securityContext: {{- include "homemaps.containerSecurity" . | nindent 12 }}
          ports:
            - { name: http, containerPort: 8080 }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
          resources: {{- toYaml .Values.tiles.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: script, mountPath: /script }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: {{ $naam }} }
        - name: script
          configMap: { name: {{ $naam }}, defaultMode: 0555 }
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
---
# Bouwt periodiek een verse mbtiles. Bij de eerste installatie handmatig:
#   kubectl create job --from=cronjob/{{ $naam }}-planetiler planetiler-eerste
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $naam }}-planetiler
  labels: {{- include "homemaps.labels" (dict "root" . "naam" "planetiler") | nindent 4 }}
spec:
  schedule: {{ $pt.schedule | quote }}
  timeZone: {{ $pt.timeZone }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 21600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels: {{- include "homemaps.labels" (dict "root" . "naam" "planetiler") | nindent 12 }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "homemaps.fullname" . }}-ververs
          securityContext: {{- include "homemaps.podSecurity" (dict "root" .) | nindent 12 }}
          initContainers:
            - name: voorbereiden
              image: docker.io/library/alpine:3.24
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c", "mkdir -p /data/tiles"]
              securityContext: {{- include "homemaps.containerSecurity" . | nindent 16 }}
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { memory: 128Mi }
              volumeMounts:
                - { name: data, mountPath: /data }
            # De zware stap. --nodemap-type moet sortedtable blijven: het array-type
            # reserveert een tabel over het hele bereik van OSM-node-id's en is
            # alleen zinnig voor een planet-import.
            - name: planetiler
              image: {{ printf "%s:%s" $pt.image.repository $pt.image.tag }}
              imagePullPolicy: IfNotPresent
              args:
                - "--download"
                - "--area={{ .Values.gebied.naam }}"
                - "--force"
                {{- if $pt.wereld.enabled }}
                - "--minzoom={{ add $pt.wereld.maxzoom 1 }}"
                {{- end }}
                - "--output=/data/tiles/kaart-nieuw.mbtiles"
                - "--tmpdir=/scratch/tmp"
                - "--download-dir=/scratch/sources"
                - "--nodemap-type=sortedtable"
                - "--storage=mmap"
              env:
                - { name: JAVA_TOOL_OPTIONS, value: "{{ $pt.javaOpts }} -Djava.io.tmpdir=/scratch/tmp" }
              securityContext: {{- include "homemaps.containerSecurity" . | nindent 16 }}
              resources: {{- toYaml $pt.resources | nindent 16 }}
              volumeMounts:
                - { name: scratch, mountPath: /scratch }
                - { name: data, mountPath: /data }
            {{- if $pt.wereld.enabled }}
            # De wereld op lage zoom, uit Natural Earth en de water polygons die
            # planetiler toch al ophaalt. Zelfde PBF, zodat het gebied ook op lage
            # zoom zijn eigen namen houdt; daarbuiten alleen vormen, geen labels.
            - name: planetiler-wereld
              image: {{ printf "%s:%s" $pt.image.repository $pt.image.tag }}
              imagePullPolicy: IfNotPresent
              args:
                - "--download"
                - "--area={{ .Values.gebied.naam }}"
                - "--force"
                - "--bounds=planet"
                - "--maxzoom={{ $pt.wereld.maxzoom }}"
                - "--output=/scratch/wereld.mbtiles"
                - "--tmpdir=/scratch/tmp"
                - "--download-dir=/scratch/sources"
                - "--nodemap-type=sortedtable"
                - "--storage=mmap"
              env:
                - { name: JAVA_TOOL_OPTIONS, value: "{{ $pt.javaOpts }} -Djava.io.tmpdir=/scratch/tmp" }
              securityContext: {{- include "homemaps.containerSecurity" . | nindent 16 }}
              resources: {{- toYaml $pt.resources | nindent 16 }}
              volumeMounts:
                - { name: scratch, mountPath: /scratch }
            - name: samenvoegen
              image: docker.io/library/python:3.14-alpine
              imagePullPolicy: IfNotPresent
              command: ["python3", "/script/samenvoegen.py", "/data/tiles/kaart-nieuw.mbtiles", "/scratch/wereld.mbtiles"]
              securityContext: {{- include "homemaps.containerSecurity" . | nindent 16 }}
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { memory: 512Mi }
              volumeMounts:
                - { name: scratch, mountPath: /scratch }
                - { name: data, mountPath: /data }
                - { name: script, mountPath: /script }
            {{- end }}
          containers:
            # Een hernoeming binnen hetzelfde volume is atomair en kost geen kopie.
            # tileserver-gl leest zijn bestanden alleen bij het starten in, dus de
            # pod moet daarna weg. `delete pod` en geen `rollout restart`: dat
            # laatste zet een annotatie op het Deployment, en dat is drift.
            - name: wissel
              image: docker.io/alpine/kubectl:1.37.0
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  test -s /data/tiles/kaart-nieuw.mbtiles
                  mv /data/tiles/kaart-nieuw.mbtiles /data/tiles/kaart.mbtiles
                  kubectl delete pod -l app.kubernetes.io/instance={{ .Release.Name }},app.kubernetes.io/component=tiles --ignore-not-found
              securityContext: {{- include "homemaps.containerSecurity" . | nindent 16 }}
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 256Mi }
              volumeMounts:
                - { name: data, mountPath: /data }
          volumes:
            - name: scratch
              persistentVolumeClaim: { claimName: {{ include "homemaps.onderdeel" $scratch }} }
            - name: data
              persistentVolumeClaim: { claimName: {{ $naam }} }
            - name: script
              configMap: { name: {{ $naam }} }
{{- end }}
