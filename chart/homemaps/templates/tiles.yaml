{{- if .Values.tiles.enabled }}
{{- $t := dict "root" . "name" "tiles" }}
{{- $name := include "homemaps.component" $t }}
{{- $scratch := dict "root" . "name" "planetiler-scratch" }}
{{- $pt := .Values.tiles.planetiler }}
{{ include "homemaps.pvc" (merge (dict "size" .Values.tiles.size) $t) }}
---
{{ include "homemaps.pvc" (merge (dict "size" $pt.scratchSize) $scratch) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels: {{- include "homemaps.labels" $t | nindent 4 }}
data:
  bootstrap.sh: | {{- .Files.Get "files/bootstrap.sh" | nindent 4 }}
  merge.py: | {{- .Files.Get "files/merge.py" | nindent 4 }}
  # The key `v3` under `data` is not free to choose: OpenMapTiles' style-local.json
  # refers to `mbtiles://{v3}`.
  config.json: |
    {
      "options": {
        "paths": { "root": "/data", "fonts": "fonts", "styles": "styles", "mbtiles": "tiles" },
        "formatQuality": { "jpeg": 80, "webp": 90 },
        "maxScaleFactor": 2,
        "minRendererPoolSizes": {{ .Values.tiles.rendererPool.min | toJson }},
        "maxRendererPoolSizes": {{ .Values.tiles.rendererPool.max | toJson }},
        "serveAllFonts": true,
        "serveStaticMaps": false,
        "allowRemoteMarkerIcons": false,
        "staticAttributionText": "© OpenMapTiles © OpenStreetMap contributors"
      },
      "styles": {
        {{- range $i, $style := .Values.tiles.styles }}
        {{- if $i }},{{ end }}
        {{ $style | quote }}: { "style": "{{ $style }}/style-local.json", "serve_rendered": true, "serve_data": true }
        {{- end }}
      },
      "data": { "v3": { "mbtiles": "map.mbtiles" } }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "homemaps.labels" $t | nindent 4 }}
spec:
  selector: {{- include "homemaps.selector" $t | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "homemaps.labels" $t | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 0
  # The volume is ReadWriteOnce: the old pod must be gone before the new one can start.
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "homemaps.selector" $t | nindent 6 }}
  template:
    metadata:
      labels: {{- include "homemaps.labels" $t | nindent 8 }}
      annotations:
        checksum/config: {{ .Files.Get "files/bootstrap.sh" | sha256sum | trunc 16 }}-{{ toJson .Values.tiles.styles | sha256sum | trunc 16 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- include "homemaps.podSecurity" (dict "root" .) | nindent 8 }}
      initContainers:
        # Puts the styles and fonts on the volume once (the image only bundles
        # `basic-preview`) and then waits until there is an mbtiles.
        - name: bootstrap
          image: docker.io/library/alpine:3.24
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/script/bootstrap.sh"]
          env:
            - { name: PLANETILER_CRONJOB, value: {{ printf "%s-planetiler" $name | quote }} }
          securityContext: {{- include "homemaps.containerSecurity" . | nindent 12 }}
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: script, mountPath: /script }
            - { name: tmp, mountPath: /tmp }
      containers:
        # No `command:`: the image's entrypoint starts Xvfb itself, which the
        # server-side renderer needs.
        - name: tileserver
          image: {{ include "homemaps.image" (dict "root" . "image" .Values.tiles.image) }}
          imagePullPolicy: {{ .Values.tiles.image.pullPolicy }}
          args:
            - "--config"
            - "/script/config.json"
            - "--port"
            - "8080"
            {{- with .Values.tiles.publicUrl }}
            - "--public_url"
            - {{ . | quote }}
            {{- end }}
          env:
            # Without a fixed publicUrl tileserver-gl builds its URLs from the Host header
            # (the web pod's nginx adds X-Forwarded-Path). Then only our own hostnames
            # are allowed: otherwise a made-up Host could end up in a cached
            # response.
            - { name: TILESERVER_GL_ALLOWED_HOSTS, value: {{ include "homemaps.allowedHosts" . | quote }} }
            - { name: HOME, value: "/tmp" }
            - { name: XDG_CACHE_HOME, value: "/tmp" }
          securityContext: {{- include "homemaps.containerSecurity" . | nindent 12 }}
          ports:
            - { name: http, containerPort: 8080 }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
          resources: {{- toYaml .Values.tiles.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: script, mountPath: /script }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: {{ $name }} }
        - name: script
          configMap: { name: {{ $name }}, defaultMode: 0555 }
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
---
# Periodically builds a fresh mbtiles. On first install, by hand:
#   kubectl create job --from=cronjob/{{ $name }}-planetiler planetiler-initial
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}-planetiler
  labels: {{- include "homemaps.labels" (dict "root" . "name" "planetiler") | nindent 4 }}
spec:
  schedule: {{ $pt.schedule | quote }}
  timeZone: {{ $pt.timeZone }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 21600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels: {{- include "homemaps.labels" (dict "root" . "name" "planetiler") | nindent 12 }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "homemaps.fullname" . }}-refresher
          securityContext: {{- include "homemaps.podSecurity" (dict "root" .) | nindent 12 }}
          initContainers:
            - name: prepare
              image: docker.io/library/alpine:3.24
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c", "mkdir -p /data/tiles"]
              securityContext: {{- include "homemaps.containerSecurity" . | nindent 16 }}
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { memory: 128Mi }
              volumeMounts:
                - { name: data, mountPath: /data }
            # The heavy step. --nodemap-type must stay sortedtable: the array type
            # reserves a table over the whole range of OSM node ids and is only
            # sensible for a planet import.
            - name: planetiler
              image: {{ printf "%s:%s" $pt.image.repository $pt.image.tag }}
              imagePullPolicy: IfNotPresent
              args:
                - "--download"
                - "--area={{ .Values.region.name }}"
                - "--force"
                {{- if $pt.world.enabled }}
                - "--minzoom={{ add $pt.world.maxzoom 1 }}"
                {{- end }}
                - "--output=/data/tiles/map-new.mbtiles"
                - "--tmpdir=/scratch/tmp"
                - "--download-dir=/scratch/sources"
                - "--nodemap-type=sortedtable"
                - "--storage=mmap"
              env:
                - { name: JAVA_TOOL_OPTIONS, value: "{{ $pt.javaOpts }} -Djava.io.tmpdir=/scratch/tmp" }
              securityContext: {{- include "homemaps.containerSecurity" . | nindent 16 }}
              resources: {{- toYaml $pt.resources | nindent 16 }}
              volumeMounts:
                - { name: scratch, mountPath: /scratch }
                - { name: data, mountPath: /data }
            {{- if $pt.world.enabled }}
            # The world at low zoom, from Natural Earth and the water polygons that
            # planetiler fetches anyway. Same PBF, so the region keeps its own names
            # at low zoom too; outside it only shapes, no labels.
            - name: planetiler-world
              image: {{ printf "%s:%s" $pt.image.repository $pt.image.tag }}
              imagePullPolicy: IfNotPresent
              args:
                - "--download"
                - "--area={{ .Values.region.name }}"
                - "--force"
                - "--bounds=planet"
                - "--maxzoom={{ $pt.world.maxzoom }}"
                - "--output=/scratch/world.mbtiles"
                - "--tmpdir=/scratch/tmp"
                - "--download-dir=/scratch/sources"
                - "--nodemap-type=sortedtable"
                - "--storage=mmap"
              env:
                - { name: JAVA_TOOL_OPTIONS, value: "{{ $pt.javaOpts }} -Djava.io.tmpdir=/scratch/tmp" }
              securityContext: {{- include "homemaps.containerSecurity" . | nindent 16 }}
              resources: {{- toYaml $pt.resources | nindent 16 }}
              volumeMounts:
                - { name: scratch, mountPath: /scratch }
            - name: merge
              image: docker.io/library/python:3.14-alpine
              imagePullPolicy: IfNotPresent
              command: ["python3", "/script/merge.py", "/data/tiles/map-new.mbtiles", "/scratch/world.mbtiles"]
              securityContext: {{- include "homemaps.containerSecurity" . | nindent 16 }}
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { memory: 512Mi }
              volumeMounts:
                - { name: scratch, mountPath: /scratch }
                - { name: data, mountPath: /data }
                - { name: script, mountPath: /script }
            {{- end }}
          containers:
            # A rename within the same volume is atomic and costs no copy.
            # tileserver-gl only reads its files at startup, so the pod has to go
            # afterwards. `delete pod` and not `rollout restart`: the latter puts an
            # annotation on the Deployment, and that is drift.
            - name: swap
              image: docker.io/alpine/kubectl:1.37.0
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  test -s /data/tiles/map-new.mbtiles
                  mv /data/tiles/map-new.mbtiles /data/tiles/map.mbtiles
                  kubectl delete pod -l app.kubernetes.io/instance={{ .Release.Name }},app.kubernetes.io/component=tiles --ignore-not-found
              securityContext: {{- include "homemaps.containerSecurity" . | nindent 16 }}
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 256Mi }
              volumeMounts:
                - { name: data, mountPath: /data }
          volumes:
            - name: scratch
              persistentVolumeClaim: { claimName: {{ include "homemaps.component" $scratch }} }
            - name: data
              persistentVolumeClaim: { claimName: {{ $name }} }
            - name: script
              configMap: { name: {{ $name }} }
{{- end }}
