{{- if and .Values.valhalla.enabled .Values.valhalla.traffic.enabled }}
{{- $v := dict "root" . "name" "valhalla" }}
{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "homemaps.fullname" . }}-traffic
  labels:
    {{- include "homemaps.labels" $v | nindent 4 }}
    {{- with .Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels: {{- include "homemaps.selector" $v | nindent 6 }}
  endpoints:
    - port: metrics
      interval: 60s
{{- end }}
{{- if .Values.monitoring.prometheusRule.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "homemaps.fullname" . }}-traffic
  labels:
    {{- include "homemaps.labels" $v | nindent 4 }}
    {{- with .Values.monitoring.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: homemaps-traffic
      rules:
        # Valhalla has no notion of staleness: if the importer stops writing, the
        # traffic jams of that moment stay in every route.
        - alert: HomemapsTrafficStale
          expr: time() - homemaps_traffic_last_cycle_timestamp_seconds > {{ .Values.monitoring.prometheusRule.maxAgeSeconds }}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: The traffic importer has not finished a cycle for {{ "{{ $value | humanizeDuration }}" }}
            description: Live traffic in Valhalla is stale. Check the logs of container `traffic` in the valhalla pod.
        - alert: HomemapsTrafficAbsent
          expr: absent(homemaps_traffic_last_cycle_timestamp_seconds)
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: The traffic importer is not reporting metrics
{{- end }}
{{- end }}
