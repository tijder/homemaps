{{- if .Values.web.enabled }}
{{- $w := dict "root" . "name" "web" }}
{{- $name := include "homemaps.component" $w }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels: {{- include "homemaps.labels" $w | nindent 4 }}
data:
  config.json: {{ .Values.web.config | toJson | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "homemaps.labels" $w | nindent 4 }}
spec:
  selector: {{- include "homemaps.selector" $w | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "homemaps.labels" $w | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 0
  # One replica on possibly one node: with a surge rollout the new pod can get
  # stuck; stopping first, then starting always works.
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "homemaps.selector" $w | nindent 6 }}
  template:
    metadata:
      labels: {{- include "homemaps.labels" $w | nindent 8 }}
      annotations:
        checksum/config: {{ .Values.web.config | toJson | sha256sum | trunc 16 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: {{ include "homemaps.image" (dict "root" . "image" .Values.web.image) }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          env:
            # nginx proxies /valhalla, /geocode, /tiles and /traffic here. A
            # component that is disabled yields a 502 on its path, nothing worse.
            # Fully qualified names: nginx's resolver does not know the pod's
            # search domains.
            - { name: VALHALLA_UPSTREAM, value: "http://{{ include "homemaps.component" (dict "root" . "name" "valhalla") }}.{{ .Release.Namespace }}.svc.{{ .Values.clusterDomain }}:8002" }
            - { name: PHOTON_UPSTREAM, value: "http://{{ include "homemaps.component" (dict "root" . "name" "photon") }}.{{ .Release.Namespace }}.svc.{{ .Values.clusterDomain }}:2322" }
            - { name: TRAFFIC_UPSTREAM, value: "http://{{ include "homemaps.component" (dict "root" . "name" "valhalla") }}.{{ .Release.Namespace }}.svc.{{ .Values.clusterDomain }}:9100" }
            - { name: TILES_UPSTREAM, value: "http://{{ include "homemaps.component" (dict "root" . "name" "tiles") }}.{{ .Release.Namespace }}.svc.{{ .Values.clusterDomain }}:8080" }
          securityContext: {{- include "homemaps.containerSecurity" . | nindent 12 }}
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /usr/share/nginx/html/config }
      volumes:
        - name: config
          configMap: { name: {{ $name }} }
{{- end }}
