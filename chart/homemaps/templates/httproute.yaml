{{- if and .Values.httpRoute.enabled .Values.web.enabled }}
{{- $w := dict "root" . "name" "web" }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "homemaps.fullname" . }}
  labels: {{- include "homemaps.labels" $w | nindent 4 }}
spec:
  parentRefs: {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames: {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
  rules:
    - backendRefs:
        - name: {{ include "homemaps.component" $w }}
          port: 8080
{{- end }}
{{- if and .Values.httpRoute.enabled .Values.website.enabled }}
{{- $s := dict "root" . "name" "website" }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "homemaps.fullname" . }}-website
  labels: {{- include "homemaps.labels" $s | nindent 4 }}
spec:
  parentRefs: {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames: {{- toYaml (include "homemaps.websiteHostnames" . | fromJsonArray) | nindent 4 }}
  rules:
    - backendRefs:
        - name: {{ include "homemaps.component" $s }}
          port: 8080
{{- end }}
