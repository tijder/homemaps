{{- if .Values.valhalla.enabled }}
{{- $v := dict "root" . "name" "valhalla" }}
{{- $name := include "homemaps.component" $v }}
{{- $traffic := .Values.valhalla.traffic }}
{{ include "homemaps.pvc" (merge (dict "size" .Values.valhalla.size) $v) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels: {{- include "homemaps.labels" $v | nindent 4 }}
data:
  build.sh: | {{- .Files.Get "files/valhalla-build.sh" | nindent 4 }}
  fetch.py: | {{- .Files.Get "files/fetch.py" | nindent 4 }}
  elevation.py: | {{- .Files.Get "files/elevation.py" | nindent 4 }}
  boundaries.py: | {{- .Files.Get "files/boundaries.py" | nindent 4 }}
  # The config is regenerated on every start, so it matches the version of the
  # image. The paths point to /data/active: that is where the build job puts a
  # complete tileset, in a single rename.
  start.sh: |
    #!/bin/bash
    set -euo pipefail
    valhalla_build_config \
      --mjolnir-tile-extract /data/active/tiles.tar \
      --mjolnir-traffic-extract /data/active/traffic.tar \
      --mjolnir-timezone /data/active/timezones.sqlite \
      --mjolnir-admin /data/active/admins.sqlite \
      --additional-data-elevation /data/elevation > /tmp/valhalla.json
    exec valhalla_service /tmp/valhalla.json {{ .Values.valhalla.threads }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "homemaps.labels" $v | nindent 4 }}
spec:
  selector: {{- include "homemaps.selector" $v | nindent 4 }}
  ports:
    - { name: http, port: 8002, targetPort: http }
    {{- if $traffic.enabled }}
    - { name: metrics, port: 9100, targetPort: metrics }
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "homemaps.labels" $v | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 0
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "homemaps.selector" $v | nindent 6 }}
  template:
    metadata:
      labels: {{- include "homemaps.labels" $v | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- include "homemaps.podSecurity" (dict "root" .) | nindent 8 }}
      initContainers:
        # On a fresh install there is no tileset yet; waiting is neater than a
        # CrashLoopBackOff.
        - name: wait
          image: docker.io/library/alpine:3.24
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              while [ ! -s /data/active/tiles.tar ]; do
                echo "waiting for /data/active/tiles.tar -- run the build job:"
                echo "  kubectl create job --from=cronjob/{{ $name }}-build valhalla-initial"
                sleep 60
              done
          securityContext: {{- include "homemaps.containerSecurity" . | nindent 12 }}
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
      containers:
        - name: valhalla
          image: {{ include "homemaps.image" (dict "root" . "image" .Values.valhalla.image) }}
          imagePullPolicy: {{ .Values.valhalla.image.pullPolicy }}
          command: ["/bin/bash", "/script/start.sh"]
          securityContext:
            {{- include "homemaps.containerSecurity" . | nindent 12 }}
            readOnlyRootFilesystem: true
          ports:
            - { name: http, containerPort: 8002 }
          startupProbe:
            httpGet: { path: /status, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /status, port: http }
            periodSeconds: 30
          resources: {{- toYaml .Values.valhalla.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: script, mountPath: /script }
            - { name: tmp, mountPath: /tmp }
        {{- if $traffic.enabled }}
        # In the same pod, and it has to be: Valhalla keeps traffic.tar open via mmap
        # and the importer writes into that same file. That way Valhalla sees every
        # change without a restart.
        - name: traffic
          image: {{ include "homemaps.image" (dict "root" . "image" $traffic.image) }}
          imagePullPolicy: {{ $traffic.image.pullPolicy }}
          env:
            - { name: TRAFFIC_TAR, value: /data/active/traffic.tar }
            - { name: VALHALLA_URL, value: "http://localhost:8002" }
            - { name: CACHE_DIR, value: /data/importer }
            - { name: NDW_URL, value: {{ $traffic.ndwUrl | quote }} }
            - { name: INTERVAL_SECONDS, value: {{ $traffic.intervalSeconds | quote }} }
            - { name: CLOSURES, value: {{ $traffic.closures | quote }} }
            - { name: MSI_SECONDS, value: {{ $traffic.msiSeconds | quote }} }
            # The OSM file of the last tileset build (same volume): for speed
            # limits by time of day.
            - { name: OSM_PBF, value: /data/source/region.osm.pbf }
          securityContext:
            {{- include "homemaps.containerSecurity" . | nindent 12 }}
            readOnlyRootFilesystem: true
          ports:
            - { name: metrics, containerPort: 9100 }
          resources: {{- toYaml $traffic.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
        {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: {{ $name }} }
        - name: script
          configMap: { name: {{ $name }} }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
---
# Periodically builds a fresh tileset. On first install, by hand:
#   kubectl create job --from=cronjob/{{ $name }}-build valhalla-initial
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}-build
  labels: {{- include "homemaps.labels" (dict "root" . "name" "valhalla-build") | nindent 4 }}
spec:
  schedule: {{ .Values.valhalla.build.schedule | quote }}
  timeZone: {{ .Values.valhalla.build.timeZone }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 21600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels: {{- include "homemaps.labels" (dict "root" . "name" "valhalla-build") | nindent 12 }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "homemaps.fullname" . }}-refresher
          securityContext: {{- include "homemaps.podSecurity" (dict "root" .) | nindent 12 }}
          initContainers:
            - name: build
              image: {{ include "homemaps.image" (dict "root" . "image" .Values.valhalla.image) }}
              imagePullPolicy: {{ .Values.valhalla.image.pullPolicy }}
              command: ["/bin/bash", "/script/build.sh"]
              env:
                - { name: PBF_URL, value: {{ .Values.region.pbfUrl | quote }} }
                - { name: REGION_BBOX, value: {{ .Values.region.bbox | quote }} }
                - { name: BUILD_THREADS, value: {{ .Values.valhalla.build.threads | quote }} }
              securityContext: {{- include "homemaps.containerSecurity" . | nindent 16 }}
              resources: {{- toYaml .Values.valhalla.build.resources | nindent 16 }}
              volumeMounts:
                - { name: data, mountPath: /data }
                - { name: script, mountPath: /script }
                - { name: tmp, mountPath: /tmp }
          containers:
            # Two renames within the same volume. The running Valhalla holds on to
            # its old files via mmap until the pod is gone, so there is no moment
            # at which it sees half a tileset. The importer's match cache expires
            # by itself: it is tied to the tileset.
            - name: swap
              image: docker.io/alpine/kubectl:1.37.0
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  test -s /data/new/tiles.tar
                  rm -rf /data/old
                  if [ -d /data/active ]; then mv /data/active /data/old; fi
                  mv /data/new /data/active
                  kubectl delete pod -l app.kubernetes.io/instance={{ .Release.Name }},app.kubernetes.io/component=valhalla --ignore-not-found
                  rm -rf /data/old
              securityContext: {{- include "homemaps.containerSecurity" . | nindent 16 }}
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 256Mi }
              volumeMounts:
                - { name: data, mountPath: /data }
          volumes:
            - name: data
              persistentVolumeClaim: { claimName: {{ $name }} }
            - name: script
              configMap: { name: {{ $name }} }
            - name: tmp
              emptyDir: { sizeLimit: 1Gi }
{{- end }}
