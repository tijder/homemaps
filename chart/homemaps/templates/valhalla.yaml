{{- if .Values.valhalla.enabled }}
{{- $v := dict "root" . "naam" "valhalla" }}
{{- $naam := include "homemaps.onderdeel" $v }}
{{- $verkeer := .Values.valhalla.verkeer }}
{{ include "homemaps.pvc" (merge (dict "size" .Values.valhalla.size) $v) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $naam }}
  labels: {{- include "homemaps.labels" $v | nindent 4 }}
data:
  bouw.sh: | {{- .Files.Get "files/valhalla-bouw.sh" | nindent 4 }}
  haal.py: | {{- .Files.Get "files/haal.py" | nindent 4 }}
  hoogte.py: | {{- .Files.Get "files/hoogte.py" | nindent 4 }}
  # De config wordt bij elke start opnieuw gegenereerd, zodat hij bij de versie van
  # het image hoort. De paden wijzen naar /data/actief: daar zet de bouwjob een
  # complete tileset neer, in één hernoeming.
  start.sh: |
    #!/bin/bash
    set -euo pipefail
    valhalla_build_config \
      --mjolnir-tile-extract /data/actief/tiles.tar \
      --mjolnir-traffic-extract /data/actief/traffic.tar \
      --mjolnir-timezone /data/actief/timezones.sqlite \
      --mjolnir-admin /data/actief/admins.sqlite \
      --additional-data-elevation /data/hoogte > /tmp/valhalla.json
    exec valhalla_service /tmp/valhalla.json {{ .Values.valhalla.threads }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $naam }}
  labels: {{- include "homemaps.labels" $v | nindent 4 }}
spec:
  selector: {{- include "homemaps.selector" $v | nindent 4 }}
  ports:
    - { name: http, port: 8002, targetPort: http }
    {{- if $verkeer.enabled }}
    - { name: metrics, port: 9100, targetPort: metrics }
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $naam }}
  labels: {{- include "homemaps.labels" $v | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 0
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "homemaps.selector" $v | nindent 6 }}
  template:
    metadata:
      labels: {{- include "homemaps.labels" $v | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- include "homemaps.podSecurity" (dict "root" .) | nindent 8 }}
      initContainers:
        # Bij een verse installatie is er nog geen tileset; wachten is netter dan
        # een CrashLoopBackOff.
        - name: wacht
          image: docker.io/library/alpine:3.24
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              while [ ! -s /data/actief/tiles.tar ]; do
                echo "wacht op /data/actief/tiles.tar -- draai de bouwjob:"
                echo "  kubectl create job --from=cronjob/{{ $naam }}-bouw valhalla-eerste"
                sleep 60
              done
          securityContext: {{- include "homemaps.containerSecurity" . | nindent 12 }}
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
      containers:
        - name: valhalla
          image: {{ include "homemaps.image" (dict "root" . "image" .Values.valhalla.image) }}
          imagePullPolicy: {{ .Values.valhalla.image.pullPolicy }}
          command: ["/bin/bash", "/script/start.sh"]
          securityContext:
            {{- include "homemaps.containerSecurity" . | nindent 12 }}
            readOnlyRootFilesystem: true
          ports:
            - { name: http, containerPort: 8002 }
          startupProbe:
            httpGet: { path: /status, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /status, port: http }
            periodSeconds: 30
          resources: {{- toYaml .Values.valhalla.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: script, mountPath: /script }
            - { name: tmp, mountPath: /tmp }
        {{- if $verkeer.enabled }}
        # In dezelfde pod, en dat moet: Valhalla houdt traffic.tar via mmap open en
        # de importer schrijft in datzelfde bestand. Zo ziet Valhalla elke wijziging
        # zonder herstart.
        - name: verkeer
          image: {{ include "homemaps.image" (dict "root" . "image" $verkeer.image) }}
          imagePullPolicy: {{ $verkeer.image.pullPolicy }}
          env:
            - { name: TRAFFIC_TAR, value: /data/actief/traffic.tar }
            - { name: VALHALLA_URL, value: "http://localhost:8002" }
            - { name: CACHE_DIR, value: /data/importer }
            - { name: NDW_URL, value: {{ $verkeer.ndwUrl | quote }} }
            - { name: INTERVAL_SECONDEN, value: {{ $verkeer.intervalSeconden | quote }} }
            - { name: AFSLUITINGEN, value: {{ $verkeer.afsluitingen | quote }} }
            - { name: MSI_SECONDEN, value: {{ $verkeer.msiSeconden | quote }} }
            # Het OSM-bestand van de laatste tileset-bouw (zelfde volume): voor
            # maximumsnelheden naar tijdstip.
            - { name: OSM_PBF, value: /data/bron/gebied.osm.pbf }
          securityContext:
            {{- include "homemaps.containerSecurity" . | nindent 12 }}
            readOnlyRootFilesystem: true
          ports:
            - { name: metrics, containerPort: 9100 }
          resources: {{- toYaml $verkeer.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
        {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: {{ $naam }} }
        - name: script
          configMap: { name: {{ $naam }} }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
---
# Bouwt periodiek een verse tileset. Bij de eerste installatie handmatig:
#   kubectl create job --from=cronjob/{{ $naam }}-bouw valhalla-eerste
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $naam }}-bouw
  labels: {{- include "homemaps.labels" (dict "root" . "naam" "valhalla-bouw") | nindent 4 }}
spec:
  schedule: {{ .Values.valhalla.build.schedule | quote }}
  timeZone: {{ .Values.valhalla.build.timeZone }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 21600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels: {{- include "homemaps.labels" (dict "root" . "naam" "valhalla-bouw") | nindent 12 }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "homemaps.fullname" . }}-ververs
          securityContext: {{- include "homemaps.podSecurity" (dict "root" .) | nindent 12 }}
          initContainers:
            - name: bouw
              image: {{ include "homemaps.image" (dict "root" . "image" .Values.valhalla.image) }}
              imagePullPolicy: {{ .Values.valhalla.image.pullPolicy }}
              command: ["/bin/bash", "/script/bouw.sh"]
              env:
                - { name: PBF_URL, value: {{ .Values.gebied.pbfUrl | quote }} }
                - { name: HOOGTE_BBOX, value: {{ .Values.gebied.bbox | quote }} }
                - { name: BOUW_THREADS, value: {{ .Values.valhalla.build.threads | quote }} }
              securityContext: {{- include "homemaps.containerSecurity" . | nindent 16 }}
              resources: {{- toYaml .Values.valhalla.build.resources | nindent 16 }}
              volumeMounts:
                - { name: data, mountPath: /data }
                - { name: script, mountPath: /script }
                - { name: tmp, mountPath: /tmp }
          containers:
            # Twee hernoemingen binnen hetzelfde volume. De draaiende Valhalla houdt
            # zijn oude bestanden via mmap vast tot de pod weg is, dus er is geen
            # moment waarop hij een halve tileset ziet. De match-cache van de
            # importer vervalt vanzelf: die is gebonden aan de tileset.
            - name: wissel
              image: docker.io/alpine/kubectl:1.37.0
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  test -s /data/nieuw/tiles.tar
                  rm -rf /data/oud
                  if [ -d /data/actief ]; then mv /data/actief /data/oud; fi
                  mv /data/nieuw /data/actief
                  kubectl delete pod -l app.kubernetes.io/instance={{ .Release.Name }},app.kubernetes.io/component=valhalla --ignore-not-found
                  rm -rf /data/oud
              securityContext: {{- include "homemaps.containerSecurity" . | nindent 16 }}
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 256Mi }
              volumeMounts:
                - { name: data, mountPath: /data }
          volumes:
            - name: data
              persistentVolumeClaim: { claimName: {{ $naam }} }
            - name: script
              configMap: { name: {{ $naam }} }
            - name: tmp
              emptyDir: { sizeLimit: 1Gi }
{{- end }}
