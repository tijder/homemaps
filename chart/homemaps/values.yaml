# -- Name overrides, as in every chart.
nameOverride: ""
fullnameOverride: ""
commonLabels: {}
imagePullSecrets: []
# -- DNS domain of the cluster; nginx needs fully qualified service names.
clusterDomain: cluster.local

# The region that gets built. Tiles and routing share one PBF source; Photon has
# its own ready-made index (photon.dbUrl).
region:
  # -- Geofabrik region as planetiler knows it (`--area`).
  name: netherlands
  # -- The same PBF for Valhalla.
  pbfUrl: https://download.geofabrik.de/europe/netherlands-latest.osm.pbf
  # -- minlon,minlat,maxlon,maxlat for the elevation tiles and the country
  # boundaries (from Overpass, for Valhalla). Empty = no elevation data (then there
  # is no elevation profile and cycling ignores slopes), and the boundaries come
  # from the extract: the build fails if that leaves no complete country.
  bbox: "3.3,50.7,7.3,53.6"

# All volumes. `longhorn-no-backup` or similar fits here: everything on them
# can be rebuilt.
storage:
  storageClassName: ""
  accessMode: ReadWriteOnce

# Pods run as this user, non-root, without capabilities.
securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

web:
  enabled: true
  image:
    repository: ghcr.io/tijder/homemaps-web
    tag: ""  # empty = appVersion of the chart
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
  # -- Contents of /config.json, the app's runtime config. Leaving it empty is fine:
  # the app derives everything from its own origin (/valhalla, /geocode, /tiles).
  config: {}

# The documentation site (ghcr.io/tijder/homemaps-website), off by default.
# It gets its own hostname next to the app's; with httpRoute/ingress enabled
# the chart adds a second route for it.
website:
  enabled: false
  image:
    repository: ghcr.io/tijder/homemaps-website
    tag: ""  # empty = appVersion of the chart
    pullPolicy: IfNotPresent
  # -- Hostname(s) of the site, for the HTTPRoute or Ingress. Required when enabled.
  hostnames: []
  # -- The absolute address in canonical links and the sitemap, without a
  # trailing slash. Empty = derived from each request (Host, X-Forwarded-Proto).
  siteUrl: ""
  # -- Contents of /config.json: the links behind the buttons on the landing
  # page. An empty value hides its button. appUrl empty = https:// plus the
  # first hostname of httpRoute or ingress.
  config:
    appUrl: ""
    testflightUrl: ""
    playStoreUrl: ""
    appStoreUrl: ""
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

tiles:
  enabled: true
  image:
    repository: docker.io/maptiler/tileserver-gl
    tag: v5.6.0
    pullPolicy: IfNotPresent
  # -- Empty (recommended): tileserver-gl derives the URLs in style.json from the
  # request, so the same installation works under several hostnames. Only fill
  # this in when the tiles must be reachable from outside at one fixed URL, with a
  # trailing slash.
  publicUrl: ""
  # -- Hostnames tileserver-gl trusts besides those of `httpRoute`/`ingress`,
  # for example `localhost` for a port-forward. Without any hostname everything is
  # allowed.
  extraAllowedHosts: []
  size: 20Gi
  resources:
    requests: { cpu: 50m, memory: 512Mi }
    limits: { memory: 2Gi }
  # At most this many renderers per style ([1x, 2x]); tileserver-gl's default is
  # far too generous for a shared node.
  rendererPool: { min: [1, 1], max: [3, 1] }
  styles: [osm-bright, positron, dark-matter]
  planetiler:
    image:
      repository: ghcr.io/onthegomap/planetiler
      tag: 0.10.2
    schedule: "0 2 5 * *"
    timeZone: Europe/Amsterdam
    scratchSize: 40Gi
    javaOpts: "-Xmx2g"
    # The request is only the threshold for getting scheduled; without a limit the
    # job uses whatever is free.
    resources:
      requests: { cpu: 100m, memory: 3Gi }
      limits: { memory: 6Gi }
    # -- The world at low zoom (z0-z`maxzoom`) beneath the region, as shapes without
    # labels. Off = only the region, from z0.
    world:
      enabled: true
      maxzoom: 7

valhalla:
  enabled: true
  image:
    repository: ghcr.io/valhalla/valhalla
    tag: 3.9.0
    pullPolicy: IfNotPresent
  size: 20Gi
  threads: 2
  resources:
    requests: { cpu: 50m, memory: 1Gi }
    limits: { memory: 4Gi }
  build:
    schedule: "0 3 6 * *"
    timeZone: Europe/Amsterdam
    threads: 2
    resources:
      requests: { cpu: 100m, memory: 2Gi }
      limits: { memory: 8Gi }

  # The sidecar that writes live NDW traffic into traffic.tar. Only useful for
  # the Netherlands.
  traffic:
    enabled: true
    image:
      repository: ghcr.io/tijder/homemaps-traffic
      tag: ""  # empty = appVersion of the chart
      pullPolicy: IfNotPresent
    intervalSeconds: 300
    closures: true
    # -- How often to fetch the MSI signs above the motorway; 0 turns them off.
    msiSeconds: 60
    ndwUrl: https://opendata.ndw.nu
    resources:
      requests: { cpu: 20m, memory: 256Mi }
      limits: { memory: 1Gi }

photon:
  enabled: true
  image:
    repository: docker.io/rtuszik/photon-docker
    tag: 2.4.0
    pullPolicy: IfNotPresent
  # -- Ready-made index; see https://download1.graphhopper.com/public/
  dbUrl: https://download1.graphhopper.com/public/europe/netherlands/photon-db-netherlands-1.0-latest.tar.bz2
  size: 20Gi
  # -- JVM heap. Keep it well below the memory limit below: OpenSearch wants as
  # much room again outside the heap.
  heap: 1g
  # The image runs as this fixed user.
  runAsUser: 9011
  # -- Photon only binds IPv4. On a cluster where IPv6 is the primary family the
  # Service must say so explicitly, otherwise it gets an IPv6 ClusterIP that
  # nobody listens behind. Empty = the cluster default.
  ipFamilies: [IPv4]
  resources:
    requests: { cpu: 50m, memory: 2Gi }
    limits: { memory: 4Gi }

# Gateway API. One route, everything to the web service.
httpRoute:
  enabled: false
  hostnames: []
  parentRefs: []
  #  - name: public-gateway
  #    namespace: default
  #    sectionName: https-maps

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

networkPolicy:
  enabled: true
  # -- Namespaces allowed to reach the web service (the ingress controller or gateway).
  ingressNamespaces: [envoy-gateway-system]
  # -- Namespace of Prometheus, for scraping the traffic importer.
  monitoringNamespace: monitoring

monitoring:
  serviceMonitor:
    enabled: false
    labels: {}
  # -- Alert when the traffic importer stalls. Valhalla has no notion of staleness,
  # so a silent importer means traffic jams from hours ago in the routes.
  prometheusRule:
    enabled: false
    labels: {}
    maxAgeSeconds: 1800
