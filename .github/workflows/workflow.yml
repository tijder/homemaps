name: Build and Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  # One place for the name: ghcr.io/<owner>/homemaps-web, -traffic and charts/homemaps.
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/homemaps

jobs:
  # release.yml derives the version bump and the release notes from conventional commits;
  # a subject line that doesn't follow them costs a release its notes.
  commit-lint:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the subjects against the convention
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=$(git log --no-merges --pretty='%s' "${BASE}..${HEAD}" |
                grep -vP '^[a-z]+(\(.+\))?!?: .+' || true)
          if [ -n "$bad" ]; then
            echo "::error::These commit subjects are not conventional commits:"
            printf '  %s\n' "$bad"
            echo "Expected: <type>[(scope)][!]: <description>  — see CONTRIBUTING.md"
            exit 1
          fi
          echo "all commit subjects follow the convention"

  build:
    name: App (test, Android, web)
    # The commit that release.yml pushes is version bookkeeping and already built green.
    if: ${{ github.event_name == 'pull_request' || !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: app/pubspec.yaml
          cache: true
      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          # No restore-keys: a cache from an older pubspec.lock can make pub's
          # resolution trip halfway.
          key: pub-${{ runner.os }}-${{ hashFiles('app/pubspec.lock') }}
      - uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: zulu

      - run: flutter pub get

      # The generated files (l10n, auto_route) are checked in; this catches a
      # forgotten `build_runner` or `gen-l10n`.
      - name: Generated code is up to date
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          dart format lib test
          git diff --exit-code -- lib

      - run: flutter analyze
      - run: flutter test

      # Once more in the browser: bit operations behave differently in the JavaScript
      # build than in the VM and in wasm. Because of that the polyline decoder drew every
      # route as a straight line to the north, while all VM tests were green.
      - name: Tests in the browser (JavaScript)
        run: flutter test --platform chrome test/valhalla_service_test.dart test/search_term_test.dart

      - name: Build Android
        run: flutter build apk --release

      - name: Build Web
        run: flutter build web --release --wasm --no-web-resources-cdn

      # The whole point of this project: nothing goes out while it's in use.
      # Without webLibrarySource maplibre_gl falls back to unpkg; the string may be in the
      # bundle (it's the plugin's default), but the library itself must be
      # bundled locally.
      - name: maplibre-gl-js is bundled
        run: |
          for f in maplibre-gl.mjs maplibre-gl-shared.mjs maplibre-gl-worker.mjs maplibre-gl.css; do
            test -s "build/web/maplibre/$f" || { echo "::error::build/web/maplibre/$f is missing"; exit 1; }
          done

      - name: Upload Web Build
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: app/build/web/

      - name: Upload Android Build
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

  # Only whether it compiles: signing and TestFlight are done by release.yml. This way
  # a change that breaks iOS gets noticed without anyone having to grab a Mac.
  ios:
    name: App (iOS)
    if: ${{ github.event_name == 'pull_request' || !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: app/pubspec.yaml
          cache: true
      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          # No restore-keys, for the same reason as in the job above.
          key: pub-${{ runner.os }}-${{ hashFiles('app/pubspec.lock') }}
      - run: flutter pub get
      - name: Build iOS
        run: flutter build ios --release --no-codesign

  importer:
    name: Importer (lint, test)
    if: ${{ github.event_name == 'pull_request' || !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: importer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  chart:
    name: Chart (lint, render)
    if: ${{ github.event_name == 'pull_request' || !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint chart/homemaps --strict
      - name: Render with the defaults, with everything on, and with the CI region
        run: |
          helm template hm chart/homemaps > /dev/null
          helm template hm chart/homemaps \
            --set httpRoute.enabled=true --set 'httpRoute.hostnames={maps.example.org}' \
            --set 'httpRoute.parentRefs[0].name=gw' \
            --set ingress.enabled=true --set 'ingress.hosts={maps.example.org}' \
            --set monitoring.serviceMonitor.enabled=true --set monitoring.prometheusRule.enabled=true > /dev/null
          helm template hm chart/homemaps -f ci/values-andorra.yaml > /dev/null
      - name: The schema rejects a publicUrl without a slash
        run: |
          if helm template hm chart/homemaps --set tiles.publicUrl=https://x/tiles >/dev/null 2>&1; then
            echo "::error::values.schema.json lets an invalid publicUrl through"; exit 1
          fi

  # The whole chart in kind, with Andorra as the region and a fake NDW feed: build jobs,
  # helm test over the four proxy paths, the check that live traffic changes the route,
  # and the app in a real browser (route, navigation with a fake GPS).
  e2e:
    name: Chart end-to-end on kind
    needs: [build, importer, chart]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Download Web build
        uses: actions/download-artifact@v8
        with:
          name: web-build
          path: app/build/web
      - uses: azure/setup-helm@v5
      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true
      # For the test of the app in a real browser (ci/e2e/app_browser.py).
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Bring up the cluster and test it
        # On main also the screenshots for the App Store: release.yml takes them along.
        env:
          SCREENSHOTS: ${{ github.ref == 'refs/heads/main' && '1' || '' }}
        run: ci/up.sh
      - name: Screenshots for the App Store
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: app-store-screenshots
          path: ci/e2e/output/appstore/
          if-no-files-found: error
      - name: Screenshots of the browser test
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-browser
          path: ci/e2e/output/
          if-no-files-found: ignore
      - name: Diagnostics
        if: failure()
        run: |
          K="kubectl --context kind-homemaps -n homemaps"
          $K get pods -o wide || true
          $K get events --sort-by=.lastTimestamp | tail -40 || true
          $K get pods -o name | while read -r p; do
            echo "----- $p"
            $K logs "$p" --all-containers --prefix --tail=200 || true
          done

  docker:
    name: Images
    needs: [build, importer, e2e]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Download Web build
        uses: actions/download-artifact@v8
        with:
          name: web-build
          path: app/build/web
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/web/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-web:main
      - name: Build and push the traffic importer image
        uses: docker/build-push-action@v7
        with:
          context: importer
          file: importer/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-traffic:main

  chart-push:
    name: Chart (OCI)
    needs: [chart, e2e]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      # A prerelease version per run: the real versions come from release.yml. appVersion
      # `main` makes the chart pull the images from above.
      - name: Package and push
        run: |
          base=$(grep '^version:' chart/homemaps/Chart.yaml | awk '{print $2}')
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package chart/homemaps --version "${base}-main.${{ github.run_number }}" --app-version main -d dist
          helm push dist/homemaps-*.tgz "oci://ghcr.io/${{ github.repository_owner }}/charts"
