name: Release

# Every night, if main has moved since the last tag and is green; or by hand.
# The version follows from the conventional commits since the last tag:
#   fix -> patch, feat -> minor, `!` or BREAKING CHANGE -> major.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        default: auto
        options: [auto, patch, minor, major]

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/homemaps

jobs:
  gate:
    name: Is a release due?
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      # The green run of workflow.yml for HEAD: that's where the screenshots come from.
      run: ${{ steps.version.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Determine the version
        id: version
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          range=${last:+$last..}HEAD
          # Our own bookkeeping commit doesn't count as movement.
          commits=$(git log --no-merges --pretty='%s%n%b' "$range" | grep -v '^chore(release):' || true)
          if ! git log --no-merges --pretty='%s' "$range" | grep -qv '^chore(release):'; then
            echo "no new commits since ${last:-the beginning}"; echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Only release what was built green.
          read -r status run < <(gh run list --workflow workflow.yml --branch main --commit "$(git rev-parse HEAD)" \
                   --json conclusion,databaseId --jq '.[0] | "\(.conclusion) \(.databaseId)"' || true) || true
          if [ "$status" != "success" ]; then
            echo "::warning::the build of HEAD is '${status:-unknown}', no release"
            echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$BUMP" = auto ]; then
            if echo "$commits" | grep -qE '^[a-z]+(\(.+\))?!:|BREAKING CHANGE'; then BUMP="major"
            elif echo "$commits" | grep -qE '^feat(\(.+\))?:'; then BUMP="minor"
            else BUMP="patch"; fi
          fi
          IFS=. read -r major minor patch <<< "${last#v}"
          major=${major:-0}; minor=${minor:-0}; patch=${patch:-0}
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          {
            echo "version=$major.$minor.$patch"
            # Android wants an increasing integer as versionCode.
            echo "build=$(git rev-list --count HEAD)"
            echo "run=$run"
            echo "release=true"
          } >> "$GITHUB_OUTPUT"
          echo "release v$major.$minor.$patch ($BUMP) since ${last:-the beginning}"

  app:
    name: App
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: app/pubspec.yaml
          cache: true
      - uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: zulu
      - run: flutter pub get
      # The fixed release key (see app/android/app/build.gradle.kts). Without the
      # secret the release would rather fail than sign with a throwaway key:
      # such an APK can't be installed over an existing installation.
      - name: Release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          test -n "$KEYSTORE" || { echo "::error::secret ANDROID_KEYSTORE is missing"; exit 1; }
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/homemaps.jks"
          echo "HOMEMAPS_KEYSTORE=$RUNNER_TEMP/homemaps.jks" >> "$GITHUB_ENV"
      - name: Build Android
        env:
          HOMEMAPS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_WACHTWOORD }}
          HOMEMAPS_KEY_ALIAS: homemaps
        run: flutter build apk --release --build-name "${{ needs.gate.outputs.version }}" --build-number "${{ needs.gate.outputs.build }}"
      - name: Build Web
        run: flutter build web --release --wasm --no-web-resources-cdn --build-name "${{ needs.gate.outputs.version }}" --build-number "${{ needs.gate.outputs.build }}"
      # Both files in one dir: upload-artifact keeps the path from the
      # common parent dir, and the publish job expects them flat in dist/.
      - name: Collect the release files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/out/"
          tar -czf "$GITHUB_WORKSPACE/out/homemaps-web-${{ needs.gate.outputs.version }}.tar.gz" -C build/web .
      - uses: actions/upload-artifact@v7
        with:
          name: release-app
          path: out/
      - uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: app/build/web/

  # Same setup as ister/player: built and signed on a GitHub Mac, with
  # one App Store Connect API key and Apple's cloud certificate; no .p12,
  # no profile in the repo. A broken iOS build blocks the release; only the
  # upload to TestFlight may fail (that's Apple, not the build).
  ios:
    name: App (iOS)
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: app/pubspec.yaml
          cache: true
      - run: flutter pub get

      # altool finds the key here by itself; xcodebuild doesn't, it gets the
      # -authenticationKey* flags below (and hence no `flutter build ipa`,
      # which doesn't pass those flags on).
      - name: App Store Connect API key
        env:
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          test -n "$KEY_P8" || { echo "::error::secret APP_STORE_CONNECT_KEY_P8 is missing"; exit 1; }
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$KEY_P8" > ~/.appstoreconnect/private_keys/"AuthKey_${KEY_ID}.p8"

      # The archive is deliberately *not* signed: that would need a certificate in a
      # keychain, and forcing an identity breaks the SwiftPM plugins. The
      # export signs with Apple's cloud certificate. An unsigned archive does
      # lose Runner.entitlements (the export copies them, it doesn't create them),
      # so first sign ad hoc with the entitlements included.
      - name: Build the signed ipa
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          # CFBundleShortVersionString = semver, CFBundleVersion = number of commits:
          # TestFlight rejects a build number it has already seen.
          flutter build ios --release --config-only \
            --build-name "${{ needs.gate.outputs.version }}" --build-number "${{ needs.gate.outputs.build }}"

          KEY="$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"

          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/ios/archive/Runner.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

          APP="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          find "$APP/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) \
            -exec codesign --force --sign - {} \;
          codesign --force --sign - --generate-entitlement-der \
            --entitlements ios/Runner/Runner.entitlements "$APP"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>68TXJMQZH4</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath build/ios/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

          mkdir -p "$GITHUB_WORKSPACE/out"
          mv build/ios/ipa/*.ipa "$GITHUB_WORKSPACE/out/homemaps-${{ needs.gate.outputs.version }}.ipa"

      - uses: actions/upload-artifact@v7
        with:
          name: release-ios
          path: out/

      # Validate first: a readable error in this log instead of an email from Apple
      # half an hour later. If a version doesn't arrive in TestFlight, look here.
      - name: To TestFlight
        continue-on-error: true
        working-directory: out
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --validate-app -f "homemaps-${VERSION}.ipa" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          xcrun altool --upload-app -f "homemaps-${VERSION}.ipa" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

  # The screenshots come from the e2e job of workflow.yml (the web app in the
  # kind cluster, see ci/e2e/screenshots.py): the chart already runs there.
  app-store:
    name: Screenshots to App Store Connect
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ needs.gate.outputs.run }}" -n app-store-screenshots -D screenshots
          find screenshots -name '*.png' | sort
          mkdir -p out
          (cd screenshots && zip -qr "../out/homemaps-screenshots-${{ needs.gate.outputs.version }}.zip" .)
      - uses: actions/upload-artifact@v7
        with:
          name: release-screenshots
          path: out/
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install 'pyjwt[crypto]'
      # Like TestFlight, this may fail: it's Apple, not the release. If no
      # version is ready to be submitted, upload.py creates one.
      - name: To App Store Connect
        continue-on-error: true
        env:
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: python3 ci/appstore/upload.py screenshots "${{ needs.gate.outputs.version }}"

  publish:
    name: Images, chart, tag and release
    needs: [gate, app, ios, app-store]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: web-build
          path: app/build/web
      - uses: actions/download-artifact@v8
        with:
          name: release-app
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: release-ios
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: release-screenshots
          path: dist
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The images go before the tag: a tag without an image is worse than an image
      # without a tag.
      - id: meta-web
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-web
          flavor: latest=true
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
      - id: meta-traffic
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-traffic
          flavor: latest=true
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
      - uses: docker/build-push-action@v7
        with:
          context: importer
          file: importer/Dockerfile
          push: true
          tags: ${{ steps.meta-traffic.outputs.tags }}
          labels: ${{ steps.meta-traffic.outputs.labels }}

      # Chart, app and importer share one version: the chart pulls the images with its
      # appVersion.
      - name: Put the version in the sources
        run: |
          sed -i -E "s/^version: .*/version: $VERSION/; s/^appVersion: .*/appVersion: \"$VERSION\"/" chart/homemaps/Chart.yaml
          sed -i -E "s/^version: .*/version: $VERSION+${{ needs.gate.outputs.build }}/" app/pubspec.yaml
          sed -i -E "s/^version = .*/version = \"$VERSION\"/" importer/pyproject.toml

      - uses: azure/setup-helm@v5
      - name: Chart as OCI to ghcr
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package chart/homemaps -d dist
          helm push "dist/homemaps-$VERSION.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"

      - name: Release notes from the commits
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          range=${last:+$last..}HEAD
          section() { # title, pattern
            lines=$(git log --no-merges --pretty='- %s (%h)' "$range" | grep -E "^- $2" | grep -v 'chore(release)' || true)
            [ -n "$lines" ] && printf '### %s\n%s\n\n' "$1" "$lines" || true
          }
          {
            section "New" 'feat'
            section "Fixed" 'fix'
            section "Other" '(chore|docs|test|refactor|perf|build|ci)'
            # shellcheck disable=SC2016  # the backticks belong literally in the notes
            printf '### Install\n```\nhelm install homemaps oci://ghcr.io/%s/charts/homemaps --version %s\n```\n' "${{ github.repository_owner }}" "$VERSION"
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Commit, tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chart/homemaps/Chart.yaml app/pubspec.yaml importer/pyproject.toml
          git commit -m "chore(release): v$VERSION"
          git tag "v$VERSION"
          # Atomic: the tag must not exist without the commit on main, and vice versa.
          git push --atomic origin HEAD:main "v$VERSION"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv dist/app-release.apk "dist/homemaps-$VERSION.apk"
          gh release create "v$VERSION" --title "v$VERSION" --notes-file RELEASE_NOTES.md \
            "dist/homemaps-$VERSION.apk" "dist/homemaps-$VERSION.ipa" "dist/homemaps-screenshots-$VERSION.zip" "dist/homemaps-web-$VERSION.tar.gz" "dist/homemaps-$VERSION.tgz"
