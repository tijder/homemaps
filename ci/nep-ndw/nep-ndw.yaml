# Een webserver met de nagemaakte feeds. De bestanden komen uit een ConfigMap die
# ci/up.sh uit maak.py vult (binaryData, want het is gzip).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nep-ndw
spec:
  selector: { matchLabels: { app: nep-ndw } }
  template:
    metadata: { labels: { app: nep-ndw } }
    spec:
      containers:
        - name: http
          image: docker.io/library/python:3.14-alpine
          command: ["python3", "-m", "http.server", "8080", "--directory", "/feeds"]
          ports: [{ containerPort: 8080 }]
          volumeMounts: [{ name: feeds, mountPath: /feeds }]
      volumes:
        - name: feeds
          configMap: { name: nep-ndw }
---
apiVersion: v1
kind: Service
metadata:
  name: nep-ndw
spec:
  selector: { app: nep-ndw }
  ports: [{ port: 8080 }]
