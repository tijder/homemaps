# The smallest region all three sources have an extract of: PBF 3.5 MB,
# Photon index 1.8 MB. Used by ci/up.sh (locally and in the workflow).
region:
  name: andorra
  pbfUrl: https://download.geofabrik.de/europe/andorra-latest.osm.pbf
  bbox: "1.41,42.43,1.79,42.66"

storage:
  storageClassName: ""

web:
  image: { repository: homemaps-web, tag: ci, pullPolicy: Never }

tiles:
  size: 2Gi
  planetiler:
    scratchSize: 4Gi
    javaOpts: "-Xmx1g"
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { memory: 3Gi }
    # The world run processes the coastlines of the whole planet; that doesn't
    # belong in a smoke test.
    world: { enabled: false }
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 1Gi }

valhalla:
  size: 2Gi
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 1Gi }
  build:
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 2Gi }
  traffic:
    image: { repository: homemaps-traffic, tag: ci, pullPolicy: Never }
    # NDW doesn't know Andorra; ci/fake-ndw serves the same feeds with a jam, a
    # closure, an accident and a temporary speed limit on roads that do exist
    # there.
    ndwUrl: http://fake-ndw:8080
    intervalSeconds: 60
    resources:
      requests: { cpu: 20m, memory: 64Mi }
      limits: { memory: 256Mi }

photon:
  dbUrl: https://download1.graphhopper.com/public/europe/andorra/photon-db-andorra-1.0-latest.tar.bz2
  size: 1Gi
  heap: 384m
  # kind is IPv4-only; the choice doesn't exist there.
  ipFamilies: []
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 1Gi }

networkPolicy:
  enabled: false
