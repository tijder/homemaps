# A web server with the fake feeds and the map sources. The feeds (and the
# server itself, server.py) come from a ConfigMap that ci/up.sh fills from
# generate.py (binaryData, since it's gzip); the sources are too large for
# one and are copied into /srv by ci/up.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-ndw
spec:
  selector: { matchLabels: { app: fake-ndw } }
  template:
    metadata: { labels: { app: fake-ndw } }
    spec:
      containers:
        - name: http
          image: docker.io/library/python:3.15-alpine
          command: ["python3", "/feeds/server.py", "8080"]
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 2
          volumeMounts:
            - { name: feeds, mountPath: /feeds }
            - { name: sources, mountPath: /srv }
      volumes:
        - name: feeds
          configMap: { name: fake-ndw }
        - name: sources
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: fake-ndw
spec:
  selector: { app: fake-ndw }
  ports: [{ port: 8080 }]
