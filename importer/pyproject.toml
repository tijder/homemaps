[project]
name = "homemaps-traffic"
version = "2.4.1"
description = "Writes live traffic from NDW into Valhalla's traffic.tar"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# ruff pinned: a new version formats differently, and `ruff format --check`
# in CI would turn main red without a change here. Renovate bumps it.
dev = ["pytest>=8", "ruff==0.17.5"]

[project.scripts]
homemaps-traffic = "homemaps_traffic.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homemaps_traffic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
